general {
    col.active_border = rgba(009dffff) rgba(ff00ccff) 45deg
    col.inactive_border = rgba(302044ff)
}
decoration {
    rounding = 16
    active_opacity = 0.96
    inactive_opacity = 0.88
    blur {
        enabled = true
        size = 5
        passes = 2
        new_optimizations = true
        ignore_opacity = false
    }
    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = rgba(05071499)
    }
}
# Blur para la barra y widgets; sin zona exclusiva para los widgets de escritorio.
layerrule {
    name = cyber-glass
    match:namespace = ^(waybar|cyberpunk-widgets)$
    blur = on
    ignore_alpha = 0.05
}
